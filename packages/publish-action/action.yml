name: Publish webhook events
description: Publish your webhook event schemas to the typedhook registry as an OpenAPI 3.1 document, authenticated with GitHub OIDC.
author: ThallesP
branding:
  icon: upload-cloud
  color: purple
inputs:
  webhooks:
    description: Path to the module exporting your webhooks() instance (TypeScript or JavaScript), relative to working-directory. Defaults to the first webhooks.ts or .js found in ., src, lib, server or utils.
  export:
    description: Name of the export holding the instance, when the module exports several.
  name:
    description: Registry name. The owner is always the repository owner, so this publishes to owner/name.
    required: true
  version:
    description: Version to publish. Defaults to the tag (v1.4.0 publishes 1.4.0) when the run is for a tag; required otherwise.
  title:
    description: OpenAPI info.title. Defaults to name.
  description:
    description: OpenAPI info.description.
  registry-url:
    description: Registry base URL. Defaults to the hosted typedhook registry.
  working-directory:
    description: Directory that webhooks and output-file are resolved against, and searched for a webhooks file.
    default: .
  dry-run:
    description: Build and validate the document without uploading it.
    default: "false"
  output-file:
    description: Also write the document to this path, relative to working-directory.
outputs:
  registry:
    description: The registry published to, as owner/name.
  version:
    description: The version published.
  hash:
    description: The document hash (sha256-<base64> over canonical JSON).
  status:
    description: created, unchanged (the same document was already published under this version) or dry-run.
runs:
  using: node24
  main: dist/index.js
